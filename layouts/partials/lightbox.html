<div class="lightbox is-hidden" id="site-lightbox" hidden data-lightbox aria-hidden="true">
  <div class="lightbox-backdrop" data-lightbox-close></div>
  <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="نمایش تصویر">
    <button type="button" class="lightbox-close" data-lightbox-close aria-label="بستن">×</button>
    <button type="button" class="lightbox-nav lightbox-prev" data-lightbox-prev aria-label="تصویر قبلی">‹</button>
    <figure class="lightbox-stage">
      <img src="" alt="" data-lightbox-image>
      <figcaption data-lightbox-caption></figcaption>
    </figure>
    <button type="button" class="lightbox-nav lightbox-next" data-lightbox-next aria-label="تصویر بعدی">›</button>
    <p class="lightbox-counter"><span data-lightbox-current>۱</span> / <span data-lightbox-total>۱</span></p>
  </div>
</div>
